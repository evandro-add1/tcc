<div class="login-container">
    <div class="login-card">
        <h1>Sistema De Vagas</h1>
        <p>Entre para acessar o Sistema</p>
        <form [formGroup]="loginForm" (ngSubmit)="entrar()">
            <!--Email-->
            <label>Email</label>
            <input type="email" formControlName="email" placeholder="Digite seu e-mail">
            <!--mensagem de erro-->
            @if(
                loginForm.controls.email.touched && loginForm.controls.email.invalid
            ){
                <small> Digite Seu E-mail válido.</small>
            }
            <label>Senha</label>
            <input type="password" formControlName="senha" placeholder="Digite sua senha">
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>
