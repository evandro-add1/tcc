<div class="login-page">
  <button type="button" class="theme-switch" (click)="theme.toggle()">
    {{ theme.theme() === 'roxo' ? 'Versão azul' : 'Versão roxa' }}
  </button>

  <div class="login-frame">
    <section class="login-card card-chanfrado-inferior-esquerdo">
      <img [src]="theme.logoOnDark()" alt="talento" />
      <h1>fazer login</h1>
      <p>Entre para acessar o sistema</p>
      <form [formGroup]="loginForm" (ngSubmit)="entrar()">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Digite seu e-mail" />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <small>Digite seu e-mail válido.</small>
        }
        <label>Senha</label>
        <input type="password" formControlName="senha" placeholder="Digite sua senha" />
        <button type="submit">Entrar</button>
      </form>
    </section>

    <aside class="login-aside card-corte-superior-direito">
      <h2>descubra o seu talento</h2>
      <p>Complete seu currículo, encontre vagas compatíveis e desenvolva novas habilidades.</p>
    </aside>
  </div>
</div>
